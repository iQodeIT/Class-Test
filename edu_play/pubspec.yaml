name: edu_play
description: "LinguaClip - Intelligent Mobile Video Editor for English Learners."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Core
  provider: ^6.1.2
  dio: ^5.5.0+1
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Video & Media
  video_player: ^2.9.1
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  flutter_blurhash: ^0.8.2

  # UI & Animations
  lottie: ^3.1.2
  uuid: ^4.3.3
  cupertino_icons: ^1.0.8

  # Offline Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Payments & Notifications (Retained from original template if needed)
  paystack_flutter_sdk: ^0.0.1-alpha.2
  onesignal_flutter: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
